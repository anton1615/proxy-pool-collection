# One-command demo for proxy-pool-collection.
#   docker compose up        -> http://127.0.0.1:8787/ (four tabs, mock data)
#   docker compose down
#
# This is demo/dev only: the four upstreams are a single stdlib mock, no real
# pool accounts, VPN tunnels or mihomo are involved. The shell is an
# UNAUTHENTICATED reverse proxy, so the port is published on loopback only.
# Never change the publish to a bare "8787:8787" on an untrusted network.
#
# No build step: both services run the official python image directly against
# a read-only bind mount of this checkout. PPC_CONFIG points at the example
# config that is already inside the mount, so the first `up` needs no copy.
# Edit docker/config.example.json (or mount your own file and repoint
# PPC_CONFIG) to point the shell at real pools.

services:
  webui:
    image: python:3.11-slim
    working_dir: /app
    command: python3 webui/server.py
    environment:
      PPC_CONFIG: /app/docker/config.example.json
    volumes:
      - .:/app:ro
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - mock

  mock:
    image: python:3.11-slim
    working_dir: /app
    command: python3 docker/mock_upstream.py 8080
    volumes:
      - .:/app:ro
    expose:
      - "8080"
